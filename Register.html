<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Student Registration with OTP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial; background: #f4f7f8; padding: 20px; }
    form { background: #fff; padding: 20px; border-radius: 10px; max-width: 400px; margin: auto; }
    input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
    button { width: 100%; padding: 10px; border: none; border-radius: 5px; background: #2196f3; color: white; font-size: 16px; }
  </style>
</head>
<body>
<script>
  // Redirect to your hosted page if not already on GitHub Pages
  if (window.location.href.indexOf("https://jyotiaurwadkar-art.github.io/Register.html") === -1) {
    window.location.href = "https://jyotiaurwadkar-art.github.io/Register.html";
  }
</script>

<h2>Student Registration</h2>

<form id="registerForm">
  <input type="text" id="name" placeholder="Student Name" required>
  <input type="text" id="school" placeholder="School Name" required>
  <input type="tel" id="phone" placeholder="Parent Contact Number (10 digits)" required>
  <div id="recaptcha-container"></div>
  <button type="button" id="sendOtpBtn" onclick="sendOTP()">Send OTP</button>
  
  <div id="otpSection" style="display:none;">
    <input type="text" id="otp" placeholder="Enter OTP" required>
    <button type="button" onclick="verifyOTP()">Verify OTP</button>
  </div>
</form>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js"></script>

<script>
  // Paste your Firebase config below 👇
  const firebaseConfig = {
  apiKey: "AIzaSyACbEbQPGDA7PnMdcfCn9rLnB7hvTved74",
    authDomain: "student-app-cba7a.firebaseapp.com",
    projectId: "student-app-cba7a",
  };
  const app = firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  // Send OTP
  function sendOTP() {
    const phone = "+91" + document.getElementById("phone").value;
    window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container');
    auth.signInWithPhoneNumber(phone, window.recaptchaVerifier)
      .then(confirmationResult => {
        window.confirmationResult = confirmationResult;
        alert("OTP sent!");
        document.getElementById("otpSection").style.display = "block";
      })
      .catch(error => alert(error.message));
  }

  // Verify OTP
  function verifyOTP() {
    const code = document.getElementById("otp").value;
    const name = document.getElementById("name").value;
    const school = document.getElementById("school").value;
    const phone = document.getElementById("phone").value;

    window.confirmationResult.confirm(code)
      .then(async (result) => {
        // Store student data in Firestore
        await db.collection("students").add({
          name: name,
          school: school,
          phone: phone,
          timestamp: new Date()
        });
        alert("Registration successful!");
        window.location.href = "home.html";
      })
      .catch(error => {
        alert("Invalid OTP. Please try again.");
      });
  }
</script>

</body>
</html>
